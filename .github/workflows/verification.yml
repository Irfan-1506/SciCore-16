name: SciCore-16 Verification & Consistency CI

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install EDA tools (Icarus Verilog, Verilator, Yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys python3

      - name: Verify Golden Reference Model & Vector Generation
        run: python3 verification/golden_model.py

      - name: Run All 7 Self-Checking Verilog Testbenches
        run: bash scripts/run_tests.sh

      - name: Run Verilator -Wall Lint & Yosys Zero-Latch Synthesis Check
        run: bash scripts/run_lint.sh

      - name: Run Cross-Artifact Consistency Check (BOM/PCB/Sch/Keymap/Netlist/DRC)
        run: python3 scripts/check_consistency.py
